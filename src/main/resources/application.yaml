spring:
  application:
    name: cartflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cartflow_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
